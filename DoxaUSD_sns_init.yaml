        * Minimum per Participant: 20 ICP
        * Maximum per Participant: 20,000 ICP
        * Dissolve Delay Duration: 24 months
        * Dissolve Delay Bonus: 100%
        * Neuron Age Duration: 12 months
        * Neuron Age Bonus: 25%
        * Initial Reward Rate: 0% (non-inflationary — §5.4)
